# ==============================================================================
# File Name: data/resume.yaml
#
# Description:
#   Single source of truth containing all structured resume and CV content,
#   including personal contact info, summary, experience, education, skills,
#   projects, certifications, and languages.
#
# How to Use:
#   Edit this file directly whenever resume information changes. Preserve valid
#   YAML formatting and quote strings containing special characters. Run ./build_all.sh
#   after editing to rebuild both the PDF and HTML outputs.
#
# Where It Is Used:
#   - Read by scripts/generate_latex.py to generate latex/sections/*.tex.
#   - Read by scripts/generate_html.py to render output/html/index.html.
#   - Tracked by build_all.sh for change detection (.cache/data.sha256).
# ==============================================================================

